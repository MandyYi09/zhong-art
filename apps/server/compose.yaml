services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zhong
      POSTGRES_PASSWORD: zhong
      POSTGRES_DB: zhong_art
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - zhong-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhong -d zhong_art"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zhong-postgres:
