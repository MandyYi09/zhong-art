services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zhong
      POSTGRES_PASSWORD: zhong
      POSTGRES_DB: zhong_art
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes: ["zhong-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhong -d zhong_art"]
      interval: 3s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports: ["${KEYCLOAK_PORT:-8080}:8080"]
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/zhong-art-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  zhong-postgres:
